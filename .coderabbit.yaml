# CodeRabbit на бесплатном тарифе для открытых репозиториев.
# Сам он у нас не запускается: у репозитория меньше десяти звёзд, и ревью
# зовут командой `@coderabbitai review` — одно в час на автора PR.
# Почему так и чем это отличается от платного — .scratch/review-bots/.
language: ru-RU

reviews:
  auto_review:
    # PR идут в `dev`, а по умолчанию CodeRabbit смотрит только PR в
    # основную ветку: с 27 августа 2026 он отвечал «Review skipped» на
    # каждый PR, и этого никто не заметил.
    base_branches:
      - dev
    # Ревью в час одно, и push, съевший его, оставил бы без ревью соседний
    # PR. Повторное ревью после правок — той же командой.
    auto_incremental_review: false

  # Ревью берёт не больше сотни файлов: черновики и снимки схемы вытесняли
  # бы из него код. Markdown целиком не исключён намеренно: исключённое не
  # попадает и в клон, а CLAUDE.md и ADR бот читает как наши правила.
  path_filters:
    - "!.scratch/**"
    - "!CHANGELOG.md"
    - "!packages/db/migrations/meta/**"
    - "!pnpm-lock.yaml"
    - "!**/public/**"
